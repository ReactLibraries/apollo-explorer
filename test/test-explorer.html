<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Embedded Explorer</title>
    <script async src="https://embeddable-explorer.cdn.apollographql.com/_latest/embeddable-explorer.umd.production.min.js"></script>
  </head>
  <body style="margin: 0; overflow-x: hidden; overflow-y: hidden; height: 100vh; width: 100vw" id="explorer"></body>
    <script type="module">
      import { getIntrospectionQuery, buildClientSchema, printSchema } from 'https://cdn.skypack.dev/graphql';
      const explorer = new EmbeddedExplorer({
        target: '#explorer',
        persistExplorerState: undefined,
        initialState:{},
        endpointUrl: 'https://countries.trevorblades.com/graphql',
        schema: '',
        handleRequest:(url, option) =>
          fetch(url, { ...option, credentials: "same-origin" })
        ,
      });
      const requestSchema = () => {
        const fetchSchema = async (url, requestInit) => {
          const response = await fetch(url, {
                ...requestInit,
                method: "POST",
                headers: {
                    ...requestInit === null || requestInit === void 0 ? void 0 : requestInit.headers,
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    query: getIntrospectionQuery(),
                }),
            });
            if (!response.ok) {
                throw new Error("Failed to fetch schema");
            }
            const {data} = await response.json();
            return printSchema(buildClientSchema(data));
        };
      const node = explorer.embeddedExplorerIFrameElement;
      fetchSchema("https://countries.trevorblades.com/graphql", {}).then((schema) => {
              node.contentWindow.postMessage({
                      name: "SchemaResponse",
                      schema,
                  }, explorer.getEmbeddedExplorerURL());
              }
          );
      };
      let isStateSent = false;
      window.addEventListener("message", (message) => {
        const {data} = message;
        if(data.name==="ExplorerListeningForSchema"){
          requestSchema();
        }
        if(data.name==="ExplorerListeningForState" && !isStateSent){
          isStateSent = true;
          const node = explorer.embeddedExplorerIFrameElement;
          node.contentWindow.postMessage({
            name: "SetOperation",
            operation: "query GetCountries {\n  countries {\n    code\n    name\n    emoji\n  }\n}",
            document: "query GetCountries {\n  countries {\n    code\n    name\n    emoji\n  }\n}"
          }, explorer.getEmbeddedExplorerURL());
        }
      });
      if(0){
        setInterval(requestSchema, 0);
      }
    </script>
  </body>
</html>
